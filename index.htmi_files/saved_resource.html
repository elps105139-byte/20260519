<!DOCTYPE html>

<html lang="zh-Hant"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作者王明｜個人介紹</title>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #0d0f1b;
            color: #e4e6eb;
            overflow-x: hidden;
            background-image:
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px),
                radial-gradient(circle at 20% 30%, rgba(0,140,255,0.15), transparent 70%),
                radial-gradient(circle at 80% 70%, rgba(255,0,140,0.12), transparent 60%);
            background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%;
        }

        .container {
            width: 85%;
            max-width: 1100px;
            margin: 60px auto;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border-radius: 18px;
            padding: 35px;
            display: flex;
            align-items: center;
            gap: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(0,200,255,0.5);
            box-shadow: 0 0 25px rgba(0,200,255,0.35);
        }

        .hello-title {
            font-size: 34px;
            margin: 0;
            background: linear-gradient(90deg, #00eaff, #ff56ff);
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 700;
        }

        .description {
            font-size: 17px;
            line-height: 1.8;
            color: #d6d8dd;
            margin-top: 10px;
        }

        .work-section {
            margin-top: 70px;
            text-align: center;
        }

        .work-title {
            font-size: 30px;
            margin-bottom: 35px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00eaff, #ff56ff);
            -webkit-background-clip: text;
            color: transparent;
        }

        .btn {
            padding: 14px 35px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            border: 2px solid #00eaff;
            color: #00eaff;
            transition: 0.25s;
            box-shadow: 0 0 10px rgba(0,234,255,0.4);
        }

        .btn:hover {
            background-color: #00eaff;
            color: #0d0f1b;
            box-shadow: 0 0 25px rgba(0,234,255,0.9);
            transform: translateY(-3px);
        }

        .work-buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .links-section {
            margin-top: 60px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .link-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.15);
        }

        iframe {
            width: 100%;
            height: 260px;
            border-radius: 10px;
        }

        .ext-link {
            display: block;
            margin-top: 12px;
            color: #00eaff;
            text-decoration: none;
            font-size: 18px;
        }

    </style>
<style>html,body,#root{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;margin:0;padding:0}html,body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Oxygen,Ubuntu,Cantarell,Helvetica Neue,Arial,sans-serif!important}button,input,textarea,select{font-family:inherit}html{background-color:transparent}html.chatgptOled.dark,html.mobileSkybridge.dark{background-color:#000}@supports (font: -apple-system-body){html.mobileSkybridge{font:-apple-system-body}}html.desktopSkybridge.dark{background-color:#1e1e1e}html.desktopSkybridge [data-openai-titlebar]{padding-left:calc(8px + var(--openai-titlebar-left-inset, 0px));padding-right:8px}html.transparentSkybridgeBackground,html.transparentSkybridgeBackground.dark{background-color:transparent}html.androidSkybridge,html.androidSkybridge body,html.androidSkybridge *{-webkit-tap-highlight-color:rgba(255,255,255,0)}html.androidSkybridge *::selection,html.androidSkybridge *::-moz-selection{background:#fff0;color:inherit}</style></head>

<body>

    <div class="container">

        <div class="profile-card">
            <img src="./me.jpg" alt="個人照片" class="profile-img">

            <div>
                <h1 class="hello-title">作者｜王明</h1>
                <p class="description">
                    王明，本網站以作者介紹與作品展示為主題。
                    你可以在這裡認識作者、瀏覽相關作品，並透過延伸連結取得更多資料。
                    網站內容可依實際作品、出版資訊與作者生平持續補充更新。
                </p>
            </div>
        </div>

        <div class="links-section">
            <div class="link-box">
                <h3>作者介紹</h3>
                <p>本區可放置王明的生平、創作背景、寫作理念與重要經歷。</p>
            </div>
            <div class="link-box">
                <h3>作品資訊</h3>
                <p>本區可放置王明的代表作品、作品簡介與相關閱讀資訊。</p>
            </div>
            <div class="link-box">
                <h3>延伸資料</h3>
                <p>可依需求加入出版社、作品介紹或其他可靠資料來源。</p>
            </div>
        </div>

        <div class="work-section">
            <h2 class="work-title">我的作品</h2>

            <div class="work-buttons">
                <a class="btn" href="https://web-sandbox.oaiusercontent.com/work1.pdf" target="_blank">作品 1</a>
                <a class="btn" href="https://web-sandbox.oaiusercontent.com/work2.pdf" target="_blank">作品 2</a>
                <a class="btn" href="https://web-sandbox.oaiusercontent.com/work3.pdf" target="_blank">作品 3</a>
            </div>
        </div>

    </div>


</body></html>
