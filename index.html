<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的個人網站</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Noto Sans TC", sans-serif;
      background: #f5f7fa;
      color: #333;
      line-height: 1.8;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .profile-img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid #e5e7eb;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      margin: 10px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      transition: 0.3s;
      font-weight: bold;
    }

    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 30px;
      color: #999;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 28px;
      }

      .card {
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <!-- 個人照片 -->
      <img src="me.jpg" alt="我的照片" class="profile-img">

      <!-- 個人資訊 -->
      <h1>你的名字</h1>

      <p>
        你好，我是一位網頁開發者 / 設計師 / 學生。<br>
        歡迎來到我的個人網站！
      </p>

      <!-- 作品集下載 -->
      <a href="work.pdf" class="btn" target="_blank">
        查看我的作品集
      </a>

      <!-- 聯絡方式 -->
      <a href="mailto:you@example.com" class="btn">
        聯絡我
      </a>

      <footer>
        © 2026 我的個人網站
      </footer>

    </div>
  </div>

</body>
</html>
